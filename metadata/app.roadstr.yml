    sudo:
      - apt-get update
      - apt-get install -y build-essential cmake
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.3
    rm:
      - android/app/src/main/jniLibs/arm64-v8a/libespeak-ng.so
      - android/app/src/main/jniLibs/armeabi-v7a/libespeak-ng.so
      - android/app/src/main/jniLibs/x86_64/libespeak-ng.so
      - assets/espeak-ng-data.tar.gz
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - ROADSTR_ANDROID_NDK=$$NDK$$ bash tools/build_espeak_android.sh
