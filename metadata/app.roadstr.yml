  - versionName: 0.5.11
    versionCode: 2050
    commit: 5af64dffa4f058411c6e9b46ef9486df8a269f2d
    sudo:
      - apt-get update
      - apt-get install -y build-essential cmake
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.3
    rm:
      - android/app/src/main/jniLibs/arm64-v8a/libespeak-ng.so
      - android/app/src/main/jniLibs/armeabi-v7a/libespeak-ng.so
      - android/app/src/main/jniLibs/x86_64/libespeak-ng.so
      - assets/espeak-ng-data.tar.gz
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - ROADSTR_ANDROID_NDK=$$NDK$$ bash tools/build_espeak_android.sh
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter precache --no-web --no-linux --no-windows --no-macos
        --no-fuchsia --android
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - android/app/src/main/jniLibs/arm64-v8a/libespeak-ng.so
      - android/app/src/main/jniLibs/armeabi-v7a/libespeak-ng.so
      - android/app/src/main/jniLibs/x86_64/libespeak-ng.so
      - assets/espeak-ng-data.tar.gz
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    ndk: 27.1.12297006

