# F-Droid metadata for Roadstr.
#
# Submit as metadata/app.roadstr.yml to https://gitlab.com/fdroid/fdroiddata
# — the filename must be the applicationId exactly (app.roadstr, as declared
# in android/app/build.gradle.kts). An earlier submission was filed as
# org.roadstr.app, an id this app has never used.
#
# Summary and Description are deliberately absent: F-Droid takes them from
# fastlane/metadata/android/en-US/ (short_description.txt, full_description.txt,
# title.txt), and duplicating them here is what maintainers ask to remove.
Categories:
  - Navigation
License: GPL-3.0-only
AuthorName: Roadstr
SourceCode: https://github.com/roadstrapp/roadstr-app
IssueTracker: https://github.com/roadstrapp/roadstr-app/issues
Changelog: https://github.com/roadstrapp/roadstr-app/releases

AutoName: Roadstr

RepoType: git
Repo: https://github.com/roadstrapp/roadstr-app.git

Builds:

  - versionName: 0.4.13
    versionCode: 22
    commit: v.0.4.13
    subdir: .
    # The build server has no Flutter SDK; it comes from the shared srclib,
    # pinned to the version this release was built and tested with.
    srclibs:
      - flutter@3.44.3
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter precache --no-web --no-linux --no-windows --no-macos --no-fuchsia --android
      - $$flutter$$/bin/flutter pub get
    # The universal APK, deliberately, not a per-ABI split. With splits enabled
    # the Flutter Gradle plugin multiplies an ABI offset into the versionCode
    # (arm64 ships as 2022, not 22), and a build whose APK versionCode differs
    # from the one declared above is rejected.
    build:
      - $$flutter$$/bin/flutter build apk --release
    output: build/app/outputs/flutter-apk/app-release.apk

AutoUpdateMode: Version v.%v
UpdateCheckMode: Tags ^v\.[0-9]+\.[0-9]+\.[0-9]+$
# Read the version straight out of the Gradle file with an explicit regex.
# This is a Flutter app: the automatic manifest scan finds nothing, because
# Flutter normally resolves the version from pubspec.yaml at build time and
# no Android file states it. Both values are therefore written literally in
# build.gradle.kts, and kept in step with pubspec.yaml by
# test/version_consistency_test.dart in the app repo.
UpdateCheckData: android/app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"([^"]+)"
CurrentVersion: 0.4.13
CurrentVersionCode: 22
