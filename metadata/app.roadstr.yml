Categories:
  - Navigation
License: GPL-3.0-only
AuthorName: Roadstr
SourceCode: https://github.com/roadstrapp/roadstr-app
IssueTracker: https://github.com/roadstrapp/roadstr-app/issues
Changelog: https://github.com/roadstrapp/roadstr-app/releases

AutoName: Roadstr

RepoType: git
Repo: https://github.com/roadstrapp/roadstr-app.git

Builds:
  - versionName: 0.4.14
    versionCode: 23
    commit: v.0.4.14
    sudo:
      - apt-get update
      - apt-get install -y cmake ninja-build
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.3
    rm:
      - android/app/src/main/jniLibs/arm64-v8a/libespeak-ng.so
      - android/app/src/main/jniLibs/armeabi-v7a/libespeak-ng.so
      - android/app/src/main/jniLibs/x86_64/libespeak-ng.so
      - assets/espeak-ng-data.tar.gz
    prebuild:
      - ROADSTR_ANDROID_NDK=$$NDK$$ bash tools/build_espeak_android.sh
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter precache --no-web --no-linux --no-windows --no-macos
        --no-fuchsia --android
      - $$flutter$$/bin/flutter pub get
    build: $$flutter$$/bin/flutter build apk --release
    ndk: 27.1.12297006

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\.[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: 
  android/app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"([^"]+)"
CurrentVersion: 0.4.14
CurrentVersionCode: 23
