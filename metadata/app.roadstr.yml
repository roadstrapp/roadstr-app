# F-Droid metadata file for Roadstr
# Submit this file via merge request to:
#   https://gitlab.com/fdroid/fdroiddata  →  metadata/app.roadstr.yml
#
# Before submitting:
#   1. Replace <COMMIT_HASH> with the git commit hash of your release tag
#   2. Add screenshots to fastlane/metadata/android/en-US/images/phoneScreenshots/
#   3. Run: fdroid lint metadata/app.roadstr.yml

Categories:
  - Navigation
License: GPL-3.0-only
AuthorName: Roadstr Team
AuthorEmail: ''
SourceCode: https://github.com/roadstrapp/roadstr-app
IssueTracker: https://github.com/roadstrapp/roadstr-app/issues
Changelog: https://github.com/roadstrapp/roadstr-app/releases

AutoName: Roadstr
Name: Roadstr
Summary: Decentralised navigation with Nostr road events and Lightning zaps
Description: |-
    Roadstr is a free, open-source navigation app built on decentralised
    technologies.

    '''Turn-by-turn navigation''' powered by OpenStreetMap and OSRM with
    voice guidance in 27 languages, speed-limit signs, and automatic rerouting.

    '''Nostr road events''' — report and receive real-time traffic jams, police,
    accidents, speed cameras, and road hazards published to the Nostr network
    (kind 1315/1316).

    '''Lightning zaps''' — tip developers and appreciate good reports with
    Bitcoin Lightning via NIP-57 and NWC wallet connect.

    '''Privacy first''' — no account required, no tracking, no analytics.
    Location is sent directly to selected routing/OpenStreetMap services and,
    for road-event subscriptions, as a coarse city-level geohash to Nostr relays.

    No Google Play Services required — falls back to Android LocationManager
    on degoogled devices.

RepoType: git
Repo: https://github.com/roadstrapp/roadstr-app

Builds:
  - versionName: 0.4.13
    versionCode: 22
    # Must match the git tag exactly. The tags in this repo carry a dot after
    # the v (v.0.4.12, v.0.4.11); earlier entries here said "v0.4.12", which
    # resolves to nothing and would fail the F-Droid build.
    commit: v.0.4.13
    subdir: .
    # The build server has no Flutter SDK; it comes from the shared srclib.
    # Keep this pinned to the version the release was built and tested with.
    srclibs:
      - flutter@3.44.3
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter precache --no-web --no-linux --no-windows --no-macos --no-fuchsia --android
      - $$flutter$$/bin/flutter pub get
    # The universal APK, deliberately, not a per-ABI split. With splits enabled
    # the Flutter Gradle plugin multiplies an ABI offset into the versionCode
    # (arm64 ships as 2022, not 22), and F-Droid rejects a build whose APK
    # versionCode does not match the one declared above.
    build:
      - $$flutter$$/bin/flutter build apk --release
    output: build/app/outputs/flutter-apk/app-release.apk

# ── Automatic update detection ────────────────────────────────────────────────
# `Version` alone looks for a tag named exactly like the version ("0.4.13").
# This repository tags releases with a dot after the v — v.0.4.13, v.0.4.12 —
# so the pattern has to be spelled out, otherwise every new release is found
# and then discarded for having no matching tag.
AutoUpdateMode: Version v.%v
# Restricted to the current tag shape on purpose: the repo still carries older
# tags in other formats (v0.3.4, v0.2.beta) which are not releases of this
# build recipe and must not be picked up as candidates.
UpdateCheckMode: Tags ^v\.[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.4.13
CurrentVersionCode: 22
